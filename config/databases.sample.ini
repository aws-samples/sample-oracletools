# =============================================================================
# oracletools - database connection file (sample)
#
#   cp config/databases.sample.ini config/databases.ini
#   # edit config/databases.ini, then:
#   python3 oracle_collector.py collect --config config/databases.ini
#
# One [section] per database to collect. The section name is only a label used
# in logs and in password prompts. Settings in [DEFAULT] apply to every section
# unless the section overrides them.
#
# WHICH DATABASE TO CONNECT TO
#   * Non-CDB ................ connect to the database service.
#   * CDB (multitenant) ...... connect to the CDB root service (CDB$ROOT) with a
#                              common user (e.g. C##ORATOOLS or SYSTEM). Every
#                              open PDB is collected automatically.
#                              A local user connected straight to a PDB service
#                              collects that PDB only.
#   * RAC .................... connect to any one instance / the SCAN service;
#                              all instances are collected.
#
# CONNECTION OPTIONS (use ONE of these per section)
#   1. host + port + service_name   -> Easy Connect  host:port/service_name
#   2. host + port + sid            -> connect descriptor with SID=
#   3. dsn                          -> anything python-oracledb accepts: an Easy
#                                      Connect string, a full
#                                      (DESCRIPTION=...) descriptor, or a
#                                      tnsnames.ora alias (set config_dir to the
#                                      folder that holds tnsnames.ora).
#
# PASSWORDS - never commit real passwords. Lookup order:
#   1. password_env = NAME   -> read from environment variable NAME
#   2. password = ...        -> plain text in this file (NOT recommended)
#   3. otherwise you are prompted at run time (input is hidden)
#
# COLLECTION USER - a dedicated read-only user prepared by your DBA, not SYS / SYSDBA.
#   Needs CREATE SESSION + SELECT ANY DICTIONARY (CDB: common user with SET CONTAINER
#   and CONTAINER_DATA=ALL; STATSPACK mode: SELECT on the PERFSTAT.STATS$ tables).
#   Details and example statements: docs/prerequisites.md
#   Objects read by the collection: docs/data-access.md
#
# COLLECTION MODE
#   collection_mode = awr    (default) up to 30 days of AWR history.
#                            !! AWR (DBA_HIST_* views) requires an Oracle
#                            !! Diagnostics Pack licence. It is the customer's
#                            !! responsibility to ensure the database is licensed.
#   collection_mode = noawr  no AWR access; metrics cover the last ~60 minutes,
#                            so run it during peak load (several times if possible).
#   collection_mode = statspack  no AWR access; up to 30 days of STATSPACK
#                            snapshots (PERFSTAT.STATS$ tables). STATSPACK must be
#                            installed and snapshotting in the container collected
#                            (non-CDB or each PDB); the user needs SELECT on them.
#   The --mode option on the command line overrides this for every database.
# =============================================================================

[DEFAULT]
port = 1521
collection_mode = awr
# auth_mode: normal (recommended). sysdba / sysoper are supported only for
# environments that cannot create a collection user; they are not needed.
auth_mode = normal
# pdbs: "all" (default) or a comma separated list, e.g. PDB1,PDB2 (CDB root connections only)
pdbs = all
# thick_mode = true loads Oracle Client libraries (needed for OS / wallet external
# authentication, Native Network Encryption and some older databases).
# Thin mode (default) needs no Oracle Client and supports 12.1 and later.
thick_mode = false
# oracle_client_lib_dir = /opt/oracle/instantclient_23_5
# Set enabled = false in a section to skip it without deleting it.
enabled = true


# --- 1. Non-CDB, Easy Connect with service name, password from environment ---
#     export ORA_PWD_SALES=...
[sales-prod]
host = dbhost01.example.com
service_name = SALESPRD
user = oratools
password_env = ORA_PWD_SALES


# --- 2. CDB root: collects CDB$ROOT and every open PDB ---
[erp-cdb]
host = dbhost02.example.com
port = 1521
service_name = ERPCDB
user = C##ORATOOLS
# no password configured -> prompted at run time


# --- 3. CDB root, only some PDBs ---
[hr-cdb]
host = dbhost03.example.com
service_name = HRCDB
user = C##ORATOOLS
pdbs = HRPDB1,HRPDB2
password_env = ORA_PWD_HR


# --- 4. Standard Edition 2 / no Diagnostics Pack licence -> non-AWR mode ---
[reporting-se2]
host = dbhost04.example.com
service_name = RPTSE2
user = oratools
collection_mode = noawr


# --- 4b. Standard Edition 2 with STATSPACK installed -> statspack mode ---
[billing-se2-statspack]
host = dbhost06.example.com
service_name = BILLSE2
user = oratools
collection_mode = statspack
enabled = false


# --- 5. Connect by SID (older databases without a service name) ---
[legacy-11g]
host = dbhost05.example.com
sid = LEGACY
user = oratools
collection_mode = noawr
# 11.2 needs Oracle Client libraries (thick mode)
thick_mode = true
enabled = false


# --- 6. RAC via SCAN, full connect descriptor ---
[billing-rac]
dsn = (DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=billing-scan.example.com)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=BILLING)))
user = oratools
password_env = ORA_PWD_BILLING
enabled = false


# --- 7. tnsnames.ora alias ---
[crm-tns]
dsn = CRMPRD
config_dir = /opt/oracle/network/admin
user = oratools
enabled = false


# --- 8. Single PDB with a local user (no access to the CDB root) ---
[pdb-only]
host = dbhost02.example.com
service_name = FINPDB
user = fin_reader
enabled = false
